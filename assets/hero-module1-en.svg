<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7865a9"/><stop offset="1" stop-color="#55aaa4"/></linearGradient></defs>
<style>
.t{font:700 34px Arial,sans-serif;fill:#fff}
.s{font:500 19px Arial,sans-serif;fill:#f5f1ff}
.f{font:500 15px Arial,sans-serif;fill:#f5f1ff;opacity:.85}
.lb{font:700 20px Arial,sans-serif;fill:#332a4b}
.ax{font:700 15px Arial,sans-serif;fill:#f5f1ff}
.num{font:700 24px Arial,sans-serif;fill:#fff}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.hour{transform-origin:230px 262px;animation:spin 60s linear infinite}
.min{transform-origin:230px 262px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.b{animation:drift 3.4s ease-in-out infinite}
.b2{animation-delay:-.8s}.b3{animation-delay:-1.6s}.b4{animation-delay:-2.4s}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
.dash{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
</style>
