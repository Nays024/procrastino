<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7865a9"/><stop offset="1" stop-color="#55aaa4"/></linearGradient></defs>
<style>
.t{font:700 34px Arial,sans-serif;fill:#fff}
.s{font:500 19px Arial,sans-serif;fill:#f5f1ff}
.f{font:500 15px Arial,sans-serif;fill:#f5f1ff;opacity:.85}
.lb{font:700 20px Arial,sans-serif;fill:#332a4b}
.ax{font:700 15px Arial,sans-serif;fill:#f5f1ff}
.num{font:700 24px Arial,sans-serif;fill:#fff}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.lb2{font:700 18px Arial,sans-serif;fill:#332a4b}
.s2{font:600 18px Arial,sans-serif;fill:#fff}
.nd{font:700 18px Arial,sans-serif;fill:#332a4b}
.cap{font:700 17px Arial,sans-serif;fill:#fff}

.orb{transform-origin:380px 262px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dash{stroke-dasharray:8 10;animation:flow 2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.glow{animation:gl 2.4s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.96}50%{opacity:.75}}
</style>
<rect width="760" height="430" rx="34" fill="url(#g)"/>
<circle cx="700" cy="60" r="110" fill="#fff" opacity=".08"/><circle cx="60" cy="390" r="150" fill="#fff" opacity=".07"/>
<text x="55" y="68" class="t">The cycle of delay</text><text x="55" y="100" class="s">Task → emotion → alternative → relief</text>
<circle class="dash" cx="380" cy="262" r="105" fill="none" stroke="#fff" stroke-width="4" opacity=".6"/><g class="orb"><circle cx="460.4" cy="194.5" r="9" fill="#ffd36b" stroke="#fff" stroke-width="3"/></g><g><rect x="280" y="135" width="200" height="44" rx="22" fill="#fff" opacity=".97"/><circle cx="302" cy="157" r="9" fill="#7865a9"/><text x="320" y="163" class="lb2" style="font-size:17px">Task</text></g><g><rect x="385" y="240" width="200" height="44" rx="22" fill="#fff" opacity=".97"/><circle cx="407" cy="262" r="9" fill="#f2766b"/><text x="425" y="268" class="lb2" style="font-size:17px">Emotion</text></g><g><rect x="280" y="345" width="200" height="44" rx="22" fill="#fff" opacity=".97"/><circle cx="302" cy="367" r="9" fill="#f5c04a"/><text x="320" y="373" class="lb2" style="font-size:17px">Alternative</text></g><g><rect x="175" y="240" width="200" height="44" rx="22" fill="#fff" opacity=".97"/><circle cx="197" cy="262" r="9" fill="#55aaa4"/><text x="215" y="268" class="lb2" style="font-size:17px">Temporary relief</text></g><g class="glow"><circle cx="655" cy="262" r="52" fill="#fff"/><text x="655" y="266" text-anchor="middle" style="font:700 30px Arial,sans-serif;fill:#398d87">10–15</text><text x="655" y="288" text-anchor="middle" style="font:700 15px Arial,sans-serif;fill:#59497f">min</text></g><text x="655" y="188" text-anchor="middle" class="cap">First step</text>
<text x="55" y="408" class="f">ProcrastiNO! · Learn, practice, move forward</text>
</svg>
