<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7865a9"/><stop offset="1" stop-color="#55aaa4"/></linearGradient></defs>
<style>
.t{font:700 34px Arial,sans-serif;fill:#fff}
.s{font:500 19px Arial,sans-serif;fill:#f5f1ff}
.f{font:500 15px Arial,sans-serif;fill:#f5f1ff;opacity:.85}
.lb{font:700 20px Arial,sans-serif;fill:#332a4b}
.ax{font:700 15px Arial,sans-serif;fill:#f5f1ff}
.num{font:700 24px Arial,sans-serif;fill:#fff}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.lb2{font:700 18px Arial,sans-serif;fill:#332a4b}
.s2{font:600 18px Arial,sans-serif;fill:#fff}
.nd{font:700 18px Arial,sans-serif;fill:#332a4b}
.cap{font:700 17px Arial,sans-serif;fill:#fff}

.climb{animation:cl 5s ease-in-out infinite}
@keyframes cl{0%,8%{opacity:1;transform:translate(0,0)}28%{transform:translate(90px,-50px)}48%{transform:translate(180px,-100px)}68%,86%{opacity:1;transform:translate(270px,-150px)}100%{opacity:0;transform:translate(270px,-150px)}}
.nx{animation:nx 2.4s ease-in-out infinite}
@keyframes nx{0%,100%{opacity:1}50%{opacity:.7}}
.wave{transform-origin:395px 140px;animation:wv 2.6s ease-in-out infinite}
@keyframes wv{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-6deg)}}
</style>
<rect width="760" height="430" rx="34" fill="url(#g)"/>
<circle cx="700" cy="60" r="110" fill="#fff" opacity=".08"/><circle cx="60" cy="390" r="150" fill="#fff" opacity=".07"/>
