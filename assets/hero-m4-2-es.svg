<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7865a9"/><stop offset="1" stop-color="#55aaa4"/></linearGradient></defs>
<style>
.t{font:700 34px Arial,sans-serif;fill:#fff}
.s{font:500 19px Arial,sans-serif;fill:#f5f1ff}
.f{font:500 15px Arial,sans-serif;fill:#f5f1ff;opacity:.85}
.lb{font:700 20px Arial,sans-serif;fill:#332a4b}
.ax{font:700 15px Arial,sans-serif;fill:#f5f1ff}
.num{font:700 24px Arial,sans-serif;fill:#fff}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.lb2{font:700 18px Arial,sans-serif;fill:#332a4b}
.s2{font:600 18px Arial,sans-serif;fill:#fff}
.nd{font:700 18px Arial,sans-serif;fill:#332a4b}
.cap{font:700 17px Arial,sans-serif;fill:#fff}

.dot1{animation:d1 2.4s ease-in-out infinite}
@keyframes d1{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(68px);opacity:0}}
.dot2{animation:d2 2.4s ease-in-out infinite;animation-delay:.6s}
